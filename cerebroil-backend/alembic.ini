# alembic.ini
# ──────────────────────────────────────────────────────────────────────────────
# The actual DATABASE_URL is injected at runtime by alembic/env.py via
# app.config.Settings.  The value below is a placeholder that will be
# overridden; keep it so alembic's config parser doesn't error on startup.
# ──────────────────────────────────────────────────────────────────────────────

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os   # default: os.pathsep

# Placeholder – overridden in env.py
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/cerebroil

[post_write_hooks]
# Optional: auto-format generated migration files with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
